name: Build WinDri (Dex Injection)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /tmp/apktool.jar
          printf '#!/bin/sh\njava -jar /tmp/apktool.jar "$@"\n' > /tmp/apktool
          chmod +x /tmp/apktool /tmp/apktool.jar
          sudo mv /tmp/apktool /usr/local/bin/apktool
          sudo mv /tmp/apktool.jar /usr/local/bin/apktool.jar

      - name: Baixar APK Base
        run: |
          # Substitua este comando pela forma de obter o APK base já pré-compilado
          # Exemplo: baixando de um repositório, release ou extraindo do próprio repositório
          mkdir -p build_output
          # curl -sL "LINK_DO_SEU_APK_BASE.apk" -o base.apk

      - name: Descompilar APK com Apktool
        run: |
          apktool d base.apk -o apktool_out -f

      - name: Compilar Código Java/Kotlin Adicional e Converter para DEX
        run: |
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)
          ANDROID_JAR=$(ls $ANDROID_SDK_ROOT/platforms/android-*/android.jar 2>/dev/null | sort -V | tail -1)

          # Compila o código Java customizado
          mkdir -p ext_classes
          javac -source 8 -target 8 \
            -cp "$ANDROID_JAR" \
            -d ext_classes \
            $(find . -name "*.java" -path "*/src/*" 2>/dev/null)

          # Converte de .class para .dex usando o d8
          mkdir -p ext_dex
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/d8 \
            --release --min-api 26 --output ext_dex \
            $(find ext_classes -name '*.class')

      - name: Reconstruir APK e Injetar DEX
        run: |
          apktool b apktool_out -o rebuilt-unsigned.apk
          
          # Injeta o DEX compilado no APK como o próximo índice livre (ex: classes2.dex)
          cp ext_dex/classes.dex classes2.dex
          zip -j rebuilt-unsigned.apk classes2.dex

      - name: Alinhar (Zipalign) e Assinar APK
        run: |
          BUILD_TOOLS=$(ls $ANDROID_SDK_ROOT/build-tools | sort -V | tail -1)
          
          # Alinhamento de memória
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/zipalign -p -f 4 \
            rebuilt-unsigned.apk aligned.apk

          # Assinatura com chave de teste
          $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner sign \
            --key $ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS/lib/apksigner.jar \
            --ks-pass pass:android \
            --out WinDri-Injected.apk \
            aligned.apk || true

      - name: Upload do APK Final
        uses: actions/upload-artifact@v4
        with:
          name: WinDri-Injected-APK
          path: '*.apk'

name: Build WinDri APK (Gradle)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repositório e Submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Módulo do App
        uses: actions/checkout@v4
        with:
          repository: LUAN228/winDri-app
          path: app
          submodules: recursive
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar Permissão e Compilar APK
        run: |
          # Procura o diretório onde o gradlew está localizado
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            TARGET_DIR=$(dirname "$GRADLEW_PATH")
            cd "$TARGET_DIR"
            chmod +x ./gradlew
            
            # Roda o build padrão focando apenas na depuração
            ./gradlew assembleDebug --no-daemon
          else
            echo "Erro: gradlew não foi encontrado!"
            exit 1
          fi

      - name: Enviar APK Gerado para as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WinDri-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'

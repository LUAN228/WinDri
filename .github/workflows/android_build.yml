name: Build WinDri APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório Principal
        uses: actions/checkout@v4

      - name: Checkout Módulo do App
        uses: actions/checkout@v4
        with:
          repository: LUAN228/winDri-app
          path: app

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Android NDK e CMake
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 8512546
          accept-android-sdk-licenses: true

      - name: Instalar componentes do SDK/NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;33.0.2"

      - name: Executar Build pelo Gradle Wrapper
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            TARGET_DIR=$(dirname "$GRADLEW_PATH")
            cd "$TARGET_DIR"
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Erro: gradlew não foi encontrado!"
            exit 1
          fi

      - name: Disponibilizar o APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: WinDri-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'

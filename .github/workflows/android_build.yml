name: Build WinDri APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório Principal
        uses: actions/checkout@v4

      - name: Checkout Módulo do App
        uses: actions/checkout@v4
        with:
          repository: LUAN228/winDri-app
          path: app

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Compilar APK usando Gradle Wrapper NATIVO
        run: |
          # Procura onde está o wrapper do Gradle local (gradlew)
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -n "$GRADLEW_PATH" ]; then
            TARGET_DIR=$(dirname "$GRADLEW_PATH")
            echo "Acessando diretório do Wrapper: $TARGET_DIR"
            cd "$TARGET_DIR"
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Erro: gradlew não foi encontrado no projeto!"
            exit 1
          fi

      - name: Disponibilizar o APK para Download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: WinDri-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'

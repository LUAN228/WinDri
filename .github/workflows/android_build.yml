name: Build WinDri APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # Permite rodar a build manualmente pela aba Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Dar permissão de execução ao Gradle Wrapper
        run: chmod +x ./gradlew

      - name: Compilar APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar o APK para Download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: WinDri-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

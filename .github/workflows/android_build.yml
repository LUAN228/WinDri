name: Build WinDri APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repositório Principal e Submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Módulo do App
        uses: actions/checkout@v4
        with:
          repository: LUAN228/winDri-app
          path: app
          submodules: recursive
          fetch-depth: 0

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Ferramentas do Sistema e NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gettext
          
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          if [ ! -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -sL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o /tmp/cmdline-tools.zip
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools/
            mkdir -p "$SDK_ROOT/cmdline-tools"
            mv /tmp/cmdline-tools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest" 2>/dev/null || true
            rm -f /tmp/cmdline-tools.zip
          fi
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;26.1.10909125" "cmake;3.22.1" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV

      - name: Executar Compilação do APK
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            TARGET_DIR=$(dirname "$GRADLEW_PATH")
            cd "$TARGET_DIR"
            chmod +x ./gradlew
            
            # Removemos o --quiet para ver erros reais do Java, mas mantemos o filtro de C/C++
            set -o pipefail
            ./gradlew assembleDebug \
              -Pandroid.nativeBuildOptions="-DCMAKE_C_FLAGS='-w' -DCMAKE_CXX_FLAGS='-w' -DCMAKE_POLICY_DEFAULT_CMP0000=OLD" \
              -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=1024m" \
              --console=plain | grep -E -v "C/C\+\+|\[[0-9]+/[0-9]+\]"
          else
            echo "Erro: gradlew não foi encontrado!"
            exit 1
          fi

      - name: Procurar APKs Criados
        run: |
          echo "=== Lista de APKs gerados no servidor ==="
          find . -name "*.apk" -type f

      - name: Upload do APK Gerado
        uses: actions/upload-artifact@v4
        with:
          name: WinDri-Debug-APK
          path: '**/*.apk'

name: Build WinDri APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório Principal
        uses: actions/checkout@v4

      - name: Checkout Módulo do App
        uses: actions/checkout@v4
        with:
          repository: LUAN228/winDri-app
          path: app

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Encontrar pasta com Gradle e Compilar
        run: |
          # Encontra a pasta onde está o arquivo settings.gradle ou build.gradle
          TARGET_DIR=$(dirname $(find . -name "settings.gradle" -o -name "build.gradle" | head -n 1))
          
          echo "Entrando na pasta do projeto: $TARGET_DIR"
          cd "$TARGET_DIR"

          # Executa o build usando o wrapper local se existir, ou o gradle do sistema
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Disponibilizar o APK para Download (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: WinDri-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'
